# Project-wide Gradle settings - OPTIMIERT FÜR EMULATOR PERFORMANCE
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1024m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRResources=true
android.enableR8.fullMode=true
kotlin.code.style=official
kotlin.incremental=true
# Emulator: schneller Build
# android.nonFinalResIds=true ist ab AGP 10 default
